    </filter>
    <clipPath id="tile"><rect x="28" y="28" width="456" height="456" rx="104"/></clipPath>
  </defs>

  <!-- Icon tile -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="28" y="28" width="456" height="230" fill="url(#sheen)"/>
  </g>
  <rect x="28.75" y="28.75" width="454.5" height="454.5" rx="103.25" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>

